<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900">
  <defs>
    <linearGradient id="sky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0a2540"/>
      <stop offset="60%" stop-color="#125e9c"/>
      <stop offset="100%" stop-color="#1e3a8a"/>
    </linearGradient>
    <linearGradient id="wall" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#e2e8f0"/>
    </linearGradient>
    <linearGradient id="roof-tile" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="roof-accent" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#7f1d1d"/>
      <stop offset="100%" stop-color="#450a0a"/>
    </linearGradient>
    <pattern id="tile-pattern" width="30" height="20" patternUnits="userSpaceOnUse">
      <path d="M0 20 C10 10, 20 10, 30 20 M15 0 L15 20" stroke="#0f172a" stroke-width="1.5" fill="none" opacity="0.4"/>
    </pattern>
  </defs>
  <rect width="1600" height="900" fill="url(#sky)"/>
  <!-- Distant Hills -->
  <path d="M0 650 Q 400 500, 800 620 T 1600 580 L 1600 900 L 0 900 Z" fill="#0f172a" opacity="0.3"/>
  <path d="M0 680 Q 500 580, 1000 660 T 1600 640 L 1600 900 L 0 900 Z" fill="#1e293b" opacity="0.4"/>
  <!-- Main House Structure -->
  <g transform="translate(600, 280)">
    <!-- Main Walls -->
    <rect x="100" y="240" width="600" height="300" fill="url(#wall)" rx="4"/>
    <rect x="120" y="260" width="120" height="180" fill="#0284c7" opacity="0.1" rx="2"/>
    <rect x="280" y="320" width="100" height="220" fill="#334155" rx="2"/> <!-- Door -->
    <rect x="440" y="300" width="200" height="160" fill="#38bdf8" opacity="0.2" rx="4"/> <!-- Window -->
    <!-- Window Frames -->
    <path d="M440 380 L640 380 M540 300 L540 460" stroke="#0284c7" stroke-width="3"/>
    
    <!-- Roof Structure (Gable / Tile Profile) -->
    <path d="M50 240 L400 40 L750 240 Z" fill="url(#roof-tile)"/>
    <path d="M50 240 L400 40 L750 240 Z" fill="url(#tile-pattern)"/>
    
    <!-- Ridge Cap -->
    <path d="M40 245 L400 32 L760 245" stroke="#e2e8f0" stroke-width="10" stroke-linecap="round" fill="none"/>
    <path d="M40 245 L400 32 L760 245" stroke="#e65100" stroke-width="6" stroke-linecap="round" fill="none"/>

    <!-- Extension Hip Roof Wing -->
    <path d="M-80 320 L150 160 L380 320 Z" fill="url(#roof-accent)"/>
    <path d="M-80 320 L150 160 L380 320 Z" fill="url(#tile-pattern)"/>
    <rect x="-40" y="320" width="380" height="220" fill="url(#wall)"/>
  </g>
</svg>
